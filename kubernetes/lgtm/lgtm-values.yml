grafana:
  additionalDataSources:
    - name: Mimir
      type: prometheus
      url: http://lgtm-stack-mimir-query-frontend.lgtm.svc.cluster.local:8080
      access: proxy
      isDefault: true # Machen wir zum Standard, damit das Dashboard sofort geht

    - name: Loki
      type: loki
      url: http://lgtm-stack-loki-gateway.lgtm.svc.cluster.local
      access: proxy

    - name: Tempo
      type: tempo
      url: http://lgtm-stack-tempo-query-frontend.lgtm.svc.cluster.local:3100
      access: proxy

  dashboards:
    default:
      cluster-cpu-dashboard:
        json: |
          {
            "title": "Cluster CPU Usage",
            "timezone": "browser",
            "panels": [
              {
                "type": "timeseries",
                "title": "CPU Usage per Pod",
                "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
                "targets": [
                  {
                    "expr": "sum(rate(container_cpu_usage_seconds_total[5m])) by (pod)",
                    "legendFormat": "{{pod}}"
                  }
                ]
              }
            ]
          }
  
  # --- Speicher für Grafana ---
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "default"  # Ersetze "default" falls dein `kubectl get storageclass` etwas anderes (wie managed-csi) ausgibt!

# ---------------------------------------------------------
# Anforderung 3: Anzahl der Replicas für Tempo verändern
# ---------------------------------------------------------
tempo:
  ingester:
    replicas: 3
  
  # --- Speicher für Tempo ---
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "default"

# --- Falls Loki und Prometheus auch in dem Chart sind, brauchen die das auch! ---
loki:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "default"