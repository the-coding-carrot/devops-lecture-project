grafana:
  sidecar:
    dashboards:
      enabled: true 
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: lgtm

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          type: prometheus
          url: http://lgtm-stack-mimir-nginx/prometheus
          access: proxy
          isDefault: true
          jsonData:
            httpHeaderName1: 'X-Scope-OrgID'
          secureJsonData:
            httpHeaderValue1: 'lgtm-student-project' 

        - name: Loki
          type: loki
          url: http://lgtm-stack-loki-gateway.lgtm.svc.cluster.local
          access: proxy

        - name: Tempo
          type: tempo
          url: http://lgtm-stack-tempo-query-frontend.lgtm.svc.cluster.local:3100
          access: proxy

  dashboards:
    default:
      cluster-cpu-dashboard:
        json: |
          {
            "uid": "cluster-cpu-01",
            "title": "Cluster CPU Usage",
            "schemaVersion": 36,
            "timezone": "browser",
            "panels": [
              {
                "type": "timeseries",
                "title": "CPU Usage per Server Node",
                "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
                "targets": [
                  {
                    "expr": "sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) by (instance)",
                    "legendFormat": "{{instance}}"
                  }
                ]
              }
            ]
          }
  
  # --- Speicher für Grafana ---
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "default"  # Ersetze "default" falls dein `kubectl get storageclass` etwas anderes (wie managed-csi) ausgibt!

# ---------------------------------------------------------
# Anforderung 3: Anzahl der Replicas für Tempo verändern
# ---------------------------------------------------------
tempo:
  ingester:
    replicas: 3
  
  # --- Speicher für Tempo ---
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "default"

# --- Falls Loki und Prometheus auch in dem Chart sind, brauchen die das auch! ---
loki:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "default"