grafana:
  additionalDataSources:
    - name: Mimir
      type: prometheus
      url: http://lgtm-stack-mimir-query-frontend.lgtm.svc.cluster.local:8080
      access: proxy
      isDefault: true
      jsonData:
        httpHeaderName1: 'X-Scope-OrgID'
      secureJsonData:
        httpHeaderValue1: 'lgtm-student-project' 

    - name: Loki
      type: loki
      url: http://lgtm-stack-loki-gateway.lgtm.svc.cluster.local
      access: proxy

    - name: Tempo
      type: tempo
      url: http://lgtm-stack-tempo-query-frontend.lgtm.svc.cluster.local:3100
      access: proxy

  dashboards:
    default:
      cluster-cpu-dashboard:
        json: |
          {
            "title": "Cluster CPU Usage",
            "timezone": "browser",
            "panels": [
              {
                "type": "timeseries",
                "title": "CPU Usage per Server Node",
                "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
                "targets": [
                  {
                    "expr": "sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) by (instance)",
                    "legendFormat": "{{instance}}"
                  }
                ]
              }
            ]
          }
  
  # --- Speicher für Grafana ---
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "default"  # Ersetze "default" falls dein `kubectl get storageclass` etwas anderes (wie managed-csi) ausgibt!

# ---------------------------------------------------------
# Anforderung 3: Anzahl der Replicas für Tempo verändern
# ---------------------------------------------------------
tempo:
  ingester:
    replicas: 3
  
  # --- Speicher für Tempo ---
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "default"

# --- Falls Loki und Prometheus auch in dem Chart sind, brauchen die das auch! ---
loki:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "default"

# --- Der Metrik-Sammler (Grafana Alloy) ---
alloy:
  enabled: true
  controller:
    type: daemonset  # Läuft auf jedem Server, um alles einzusammeln
  alloy:
    configMap:
      create: true
      content: |
        prometheus.remote_write "mimir" {
          endpoint {
            url = "http://lgtm-stack-mimir-distributor.lgtm.svc.cluster.local:8080/api/v1/push"
            headers = {
              "X-Scope-OrgID" = "lgtm-student-project", // Gleicher Ausweis wie bei Grafana!
            }
          }
        }

        // Standard Kubernetes Metriken (Nodes & Pods)

        prometheus.exporter.unix "targets" { }
        prometheus.scrape "kubernetes_nodes" {
          targets = prometheus.exporter.unix.targets.targets
          forward_to = [prometheus.remote_write.mimir.receiver]
        }
        
        // Hier können wir später noch den Webshop hinzufügen