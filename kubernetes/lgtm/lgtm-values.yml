grafana:
  additionalDataSources:
    - name: Prometheus-External
      type: prometheus
      url: http://prometheus-server.monitoring.svc.cluster.local 
      access: proxy
      isDefault: false

  dashboards:
    default:
      cluster-cpu-dashboard:
        json: |
          {
            "title": "Cluster CPU Usage",
            "timezone": "browser",
            "panels": [
              {
                "type": "timeseries",
                "title": "CPU Usage per Pod",
                "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
                "targets": [
                  {
                    "expr": "sum(rate(container_cpu_usage_seconds_total[5m])) by (pod)",
                    "legendFormat": "{{pod}}"
                  }
                ]
              }
            ]
          }
  
  # --- Speicher für Grafana ---
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "default"  # Ersetze "default" falls dein `kubectl get storageclass` etwas anderes (wie managed-csi) ausgibt!

# ---------------------------------------------------------
# Anforderung 3: Anzahl der Replicas für Tempo verändern
# ---------------------------------------------------------
tempo:
  ingester:
    replicas: 3
  
  # --- Speicher für Tempo ---
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "default"

# --- Falls Loki und Prometheus auch in dem Chart sind, brauchen die das auch! ---
loki:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "default"

prometheus:
  server:
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: "default"