apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webshop
  namespace: argocd # Sehr wichtig: ArgoCD-Apps müssen in den argocd-Namespace!
spec:
  project: default
  source:
    repoURL: https://github.com/the-coding-carrot/devops-lecture-project
    path: kubernetes
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: webshop
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true
